mutation InsertIngredient(
  # @genqlient(pointer: true)
  $groupId: uuid, 
  $ingredientName: String!
) {
  insert_cooking_ingredients_one(object: {
    group_id: $groupId,
    name: $ingredientName,
  }) {
    id
  }
}

mutation DeleteIngredient($id: uuid!) {
  delete_cooking_ingredients_by_pk(id: $id) {
    id
  }
}

query GetIngredient($id: uuid!) {
  cooking_ingredients_by_pk(id: $id) {
    id
  }
}
