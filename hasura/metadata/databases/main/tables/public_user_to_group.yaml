table:
  name: user_to_group
  schema: public
object_relationships:
  - name: group
    using:
      foreign_key_constraint_on: group_id
  - name: user
    using:
      foreign_key_constraint_on: user_id
select_permissions:
  - role: user
    permission:
      columns:
        - group_id
        - id
        - owner
        - user_id
      filter:
        group:
          user_to_groups:
            user:
              user_to_groups:
                user_id:
                  _eq: X-Hasura-User-Id
    comment: ""
delete_permissions:
  - role: user
    permission:
      filter:
        _or:
          - user_id:
              _eq: X-Hasura-User-Id
          - group:
              user_to_groups:
                _and:
                  - user_id:
                      _eq: X-Hasura-User-Id
                  - owner:
                      _eq: true
    comment: ""
