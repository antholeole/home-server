table:
  name: user
  schema: public
array_relationships:
  - name: user_to_groups
    using:
      foreign_key_constraint_on:
        column: user_id
        table:
          name: user_to_group
          schema: public
select_permissions:
  - role: user
    permission:
      columns:
        - first_name
        - last_name
        - id
      filter:
        user_to_groups:
          group:
            user_to_groups:
              user_id:
                _eq: X-Hasura-User-Id
    comment: ""
update_permissions:
  - role: user
    permission:
      columns:
        - first_name
        - last_name
      filter:
        id:
          _eq: X-Hasura-User-Id
      check: null
    comment: ""
