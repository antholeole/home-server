table:
  name: group
  schema: public
array_relationships:
  - name: group_to_subscriptions
    using:
      foreign_key_constraint_on:
        column: group_id
        table:
          name: group_to_subscription
          schema: public
  - name: recipes
    using:
      foreign_key_constraint_on:
        column: group_id
        table:
          name: recipe
          schema: cooking
  - name: user_to_groups
    using:
      foreign_key_constraint_on:
        column: group_id
        table:
          name: user_to_group
          schema: public
select_permissions:
  - role: user
    permission:
      columns:
        - id
      filter:
        user_to_groups:
          user:
            user_to_groups:
              user_id:
                _eq: X-Hasura-User-Id
    comment: ""
