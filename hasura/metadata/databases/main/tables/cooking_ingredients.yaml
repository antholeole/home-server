table:
  name: ingredients
  schema: cooking
array_relationships:
  - name: ingredient_to_recipes
    using:
      foreign_key_constraint_on:
        column: ingredient_id
        table:
          name: ingredient_to_recipe
          schema: cooking
  - name: owner
    using:
      manual_configuration:
        column_mapping:
          group_id: id
        insertion_order: null
        remote_table:
          name: group
          schema: public
insert_permissions:
  - role: user
    permission:
      check:
        owner:
          user_to_groups:
            user_id:
              _eq: X-Hasura-User-Id
      columns:
        - group_id
        - name
    comment: ""
select_permissions:
  - role: user
    permission:
      columns:
        - name
        - group_id
        - id
      filter:
        _or:
          - owner:
              user_to_groups:
                user_id:
                  _eq: X-Hasura-User-Id
          - group_id:
              _is_null: true
    comment: ""
update_permissions:
  - role: user
    permission:
      columns:
        - name
      filter:
        owner:
          user_to_groups:
            user_id:
              _eq: X-Hasura-User-Id
      check: null
    comment: ""
delete_permissions:
  - role: user
    permission:
      filter:
        owner:
          user_to_groups:
            user_id:
              _eq: X-Hasura-User-Id
    comment: ""
