table:
  name: ingredients
  schema: cooking
object_relationships:
  - name: recipe
    using:
      manual_configuration:
        column_mapping:
          recipe_id: id
        insertion_order: null
        remote_table:
          name: recipe
          schema: cooking
insert_permissions:
  - role: user
    permission:
      check:
        recipe:
          group:
            user_to_groups:
              user_id:
                _eq: X-Hasura-User-Id
      columns:
        - name
    comment: ""
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - name
        - recipe_id
      filter:
        _or:
          - recipe:
              group:
                user_to_groups:
                  user_id:
                    _eq: X-Hasura-User-Id
          - recipe:
              group_id:
                _is_null: true
    comment: ""
update_permissions:
  - role: user
    permission:
      columns:
        - name
      filter:
        recipe:
          group:
            user_to_groups:
              user_id:
                _eq: X-Hasura-User-Id
      check: null
    comment: ""
delete_permissions:
  - role: user
    permission:
      filter:
        recipe:
          group:
            user_to_groups:
              user_id:
                _eq: X-Hasura-User-Id
    comment: ""
